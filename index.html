<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ampwell | Electrical products for the trade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#FFFFFF; --ink-2:#F4F6F9; --ink-3:#EEF1F5; --line-d:#E1E6EE; --dark:#0F172A; --dark-hi:#1E293B;
  --navy:#0F1B3D; --blue:#1764E8; --blue-hi:#3D86F5; --sky:#5B9BFF;
  --bg:#FFFFFF; --card:#FFFFFF; --stage:#F2F4F8; --text:#0F172A; --muted:#5A6477; --line:#E1E6EE;
  --ok:#14804A; --warn:#B45309; --bad:#B42318;
  --on-ink:#0F172A; --on-ink-muted:#5A6477;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --f:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variation-settings:"wdth" 100}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
html,body{overflow-x:clip;max-width:100%}
.split,.pdp,.layout,.finder,.hero .wrap{grid-template-columns:minmax(0,1fr)}
.split>*,.pdp>*,.layout>*,.finder>*,.hero .wrap>*,.cards3>*,.pgrid>*,.vrow>*,.two>*{min-width:0}
.pdp h1,.pc h3,.vrow b{overflow-wrap:anywhere}
@media (min-width:900px){.wrap{padding:0 36px}}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* display type */
.disp{font-weight:850;font-variation-settings:"wdth" 125;text-transform:uppercase;letter-spacing:-.01em;line-height:.95;margin:0}
.h1{font-size:clamp(44px,8.4vw,104px)}
.h2{font-size:clamp(30px,4.6vw,56px)}
.h3{font-size:clamp(22px,2.6vw,30px)}
.lede{font-size:clamp(17px,1.6vw,20px);color:var(--muted);max-width:60ch;margin:18px 0 0}
.dark .lede{color:var(--on-ink-muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 22px;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;transition:background .15s,transform .1s,border-color .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-blue{background:var(--btn-bg,var(--dark));color:var(--btn-fg,#fff)}.btn-blue:hover{background:var(--btn-bg-h,var(--dark-hi))}
.btn-navy{background:var(--btn-bg,var(--dark));color:var(--btn-fg,#fff)}.btn-navy:hover{background:var(--btn-bg-h,var(--dark-hi))}
.btn-line{background:transparent;color:inherit;border:1px solid currentColor;border-color:var(--line)}
.btn-line{border-color:var(--btn-line,#C9D1DD);color:var(--btn-line-fg,var(--dark))}.btn-line:hover{border-color:var(--btn-line-fg,var(--dark))}
.btn-white{background:var(--btn-bg,var(--dark));color:var(--btn-fg,#fff)}.btn-white:hover{background:var(--btn-bg-h,var(--dark-hi))}
.btn-sm{padding:9px 15px;font-size:14px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:42px;height:42px;display:inline-grid;place-items:center;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--text);flex:none}
.icon-btn svg{width:19px;height:19px}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);color:var(--dark);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:rgba(255,255,255,.96)}
.hdr .wrap{display:flex;align-items:center;height:64px;gap:14px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:#14214A;flex:none}
.logo img{height:26px;width:auto}
.logo b{font-weight:850;font-variation-settings:"wdth" 125;font-size:19px;letter-spacing:.01em}
.logo b span{color:#2F6FE0}
.nav{display:none;gap:4px;margin-left:18px}
.nav a{color:#475569;text-decoration:none;font-size:14.5px;padding:8px 11px;border-radius:999px;font-weight:500}
.nav a:hover,.nav a[aria-current="page"]{color:var(--dark);background:#EEF1F5}
.hdr-tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.hdr .hbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:999px;background:transparent;border:0;color:var(--dark);cursor:pointer;position:relative}
.hdr .hbtn:hover{background:#EEF1F5}
.hdr .hbtn svg{width:21px;height:21px}
.badge{position:absolute;top:3px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--dark);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.badge[hidden]{display:none}
.ask-pill{display:none;align-items:center;gap:8px;background:var(--dark);color:#fff;border:0;border-radius:999px;padding:9px 15px 9px 12px;font-weight:600;font-size:14px;cursor:pointer}
.ask-pill svg{width:17px;height:17px}
@media (min-width:1080px){.nav{display:flex}.menu-btn{display:none!important}}
@media (min-width:640px){.ask-pill{display:inline-flex}}

/* menu overlay (from reference) */
.menu{position:fixed;inset:0;z-index:60;background:#fff;color:var(--dark);padding:calc(env(safe-area-inset-top,0px) + 84px) 0 calc(env(safe-area-inset-bottom,0px) + 24px);overflow:auto;display:none}
.menu.open{display:block}
.menu nav a{display:block;font-weight:850;font-variation-settings:"wdth" 125;text-transform:uppercase;font-size:clamp(26px,6vw,40px);text-decoration:none;padding:9px 0;border-bottom:1px solid var(--line-d);letter-spacing:-.01em}
.menu nav a[aria-current="page"]{color:#2F6FE0}
.menu .stack{display:grid;gap:10px;margin-top:26px}
.menu-close{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:16px;z-index:61}

/* sections */
.sec{padding:72px 0}
@media (min-width:900px){.sec{padding:110px 0}}
.dark{background:var(--ink);color:var(--on-ink)}
.glow{position:relative;overflow:hidden;isolation:isolate}
.glow::before{display:none;content:"";position:absolute;inset:-20% -10% auto;height:120%;background:radial-gradient(50% 45% at 50% 62%,rgba(28,100,232,.45),rgba(28,100,232,.12) 45%,transparent 70%);z-index:-1;pointer-events:none}
.grid-lines{--x:0;background-image:none;--y:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px}

/* hero */
.hero{padding:56px 0 0}
.hero .wrap{display:grid;gap:32px}
@media (min-width:980px){.hero{padding:96px 0 40px}.hero .wrap{grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);align-items:center}}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
@media (max-width:520px){.hero-cta .btn{flex:1 1 100%}}
.hero-art{position:relative;min-height:300px;display:grid;place-items:center}
.hero-art img{width:min(560px,100%);filter:drop-shadow(0 30px 40px rgba(15,23,42,.18));transform:rotate(-8deg)}
.hero-art .spec{position:absolute;font-size:12.5px;color:var(--on-ink-muted);display:flex;align-items:center;gap:8px}
.hero-art .spec i{width:34px;height:1px;background:#B8C1CE;display:block}
.hero-art .spec b{color:var(--dark);font-weight:600}
.hero-art .s1{left:0;top:2%}.hero-art .s2{right:2%;bottom:16%}
.cap{font-size:12.5px;color:var(--on-ink-muted);text-align:center;margin-top:8px}

/* job search (AI-first hero element) */
.job{margin-top:34px;background:#fff;border:1px solid #CBD3DF;box-shadow:0 10px 30px rgba(15,23,42,.06);border-radius:20px;padding:8px;max-width:640px}
.job form{display:flex;align-items:center;gap:6px}
.job input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--dark);font-size:16.5px;padding:12px 10px}
.job input::placeholder{color:#7A8599}
.job .chips{display:flex;gap:6px;flex-wrap:wrap;padding:4px 6px 6px}
.chip{border:1px solid #D5DBE5;background:#F6F8FB;color:#334155;border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--dark);color:var(--dark)}
.lchip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:7px 12px;font-size:13.5px;cursor:pointer}
.lchip:hover{border-color:var(--blue)}
.lchip[aria-pressed="true"]{background:var(--dark);border-color:var(--dark);color:#fff}
.job-res{margin-top:10px;max-width:640px}
.jr{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;background:#fff;border:1px solid var(--line);margin-top:8px;text-decoration:none;color:var(--dark);cursor:pointer;text-align:left;width:100%}
.jr:hover{border-color:#B8C1CE}
.jr img,.jr > svg{width:64px;height:48px;object-fit:contain;flex:none}
.jr .icon-btn svg{width:18px;height:18px}
.jr small{color:var(--on-ink-muted);display:block}
.jr .code{color:#2F6FE0;font-weight:700;font-size:13px}

/* rail of ranges */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:min(78%,320px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 20px 18px;margin:28px -20px 0;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
@media (min-width:900px){.rail{grid-auto-columns:300px;margin:36px -36px 0;padding:6px 36px 18px}}
.range{scroll-snap-align:start;background:var(--ink-2);color:var(--dark);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;position:relative;isolation:isolate;text-decoration:none;min-height:430px}
.range::before{display:none;content:"";position:absolute;inset:0 0 40%;background:radial-gradient(60% 60% at 50% 55%,rgba(28,100,232,.5),transparent 70%);z-index:-1}
.range .art{height:220px;display:grid;place-items:center;padding:20px}
.range .art img,.range .art svg{max-height:170px;max-width:85%;filter:drop-shadow(0 14px 18px rgba(15,23,42,.15))}
.range .body{padding:0 22px 22px;display:flex;flex-direction:column;flex:1}
.range .count{color:#2F6FE0;font-size:13px;font-weight:600}
.range h3{margin:4px 0 6px;font-size:21px;font-weight:700}
.range p{margin:0 0 18px;color:var(--on-ink-muted);font-size:14.5px}
.range .btn{margin-top:auto}

/* section header */
.sh{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px}
.sh .lede{margin-top:14px}

/* values (Every detail matters) */
.values{display:grid;gap:0;margin-top:38px;border-top:1px solid var(--line-d)}
.values > div{padding:22px 0;border-bottom:1px solid var(--line-d)}
.values h3{margin:0 0 6px;font-size:19px}
.values p{margin:0;color:var(--on-ink-muted);font-size:15px;max-width:52ch}
@media (min-width:800px){.values{grid-template-columns:repeat(4,1fr);border-top:0}.values>div{border-bottom:0;border-left:1px solid var(--line-d);padding:6px 24px}.values>div:first-child{border-left:0;padding-left:0}}

/* product cards */
.pgrid{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:560px){.pgrid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1000px){.pgrid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1280px){.pgrid.w4{grid-template-columns:repeat(4,1fr)}}
.pc{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column}
.pc .stage{background:var(--stage);height:210px;display:grid;place-items:center;position:relative;cursor:pointer;padding:18px}
.pc .stage::after{content:"";position:absolute;bottom:22px;left:50%;width:46%;height:14px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(15,23,42,.22),transparent);z-index:0}
.pc .stage img,.pc .stage svg{max-height:150px;max-width:82%;position:relative;z-index:1}
.pc .body{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
.pc .code{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.pc h3{margin:3px 0 1px;font-size:17px;line-height:1.25;font-weight:700}
.pc h3 a{text-decoration:none}
.pc h3 a:hover{color:var(--blue)}
.pc .cat{font-size:13.5px;color:var(--muted)}
.pc p{font-size:14px;color:var(--muted);margin:10px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 14px;font-size:13.5px;color:var(--muted)}
.pc .price{color:var(--text);font-weight:700}
.pc .act{display:flex;gap:8px;margin-top:auto}
.pc .act .btn{flex:1}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:13px;height:13px;border-radius:50%;border:1px solid var(--line);display:block}

/* finder */
.finder{display:grid;gap:22px;margin-top:36px}
@media (min-width:980px){.finder{grid-template-columns:380px minmax(0,1fr);align-items:start}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px}
.fq{margin-bottom:20px}
.fq:last-child{margin-bottom:0}
.fq label,.fq .lbl{display:block;font-weight:650;font-size:14.5px;margin-bottom:9px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.sel{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15px}
.toggle{display:flex;align-items:center;gap:10px;font-size:14.5px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--blue)}
.vlist{display:grid;gap:10px}
.vrow{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.vrow .th{width:72px;height:56px;background:var(--stage);border-radius:10px;display:grid;place-items:center;padding:5px}
.vrow .th img,.vrow .th svg{max-height:46px;max-width:62px}
.vrow b{display:block;font-size:15px}
.vrow small{color:var(--muted);font-size:13px}
.vrow .code{font-weight:700;color:var(--blue);font-size:14px}
.empty{padding:28px;border:1px dashed var(--line);border-radius:var(--r-lg);color:var(--muted);text-align:center}

/* catalogue */
.cat-head{padding:44px 0 26px}
.crumbs{font-size:13.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--blue)}
.layout{display:grid;gap:24px;padding-bottom:80px}
@media (min-width:1000px){.layout{grid-template-columns:260px minmax(0,1fr)}}
.side .grp{border-bottom:1px solid var(--line);padding:16px 0}
.side .grp:first-child{padding-top:0}
.side h4{margin:0 0 10px;font-size:14px}
.side .opt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;font-size:14.5px;cursor:pointer}
.side .opt input{accent-color:var(--blue);width:17px;height:17px;margin-right:9px}
.side .opt span:first-child{display:flex;align-items:center}
.side .opt em{font-style:normal;color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.searchbox{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 14px}
.searchbox input{flex:1;border:0;outline:0;background:transparent;padding:12px 0;font-size:15px;min-width:0}
.searchbox svg{width:18px;height:18px;color:var(--muted);flex:none}
.filters-btn{display:inline-flex}
@media (min-width:1000px){.filters-btn{display:none}}
.side{display:none}
@media (min-width:1000px){.side{display:block;position:sticky;top:84px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;padding-right:6px}}
.side.sheet{display:block;position:fixed;inset:auto 0 0 0;max-height:82vh;overflow:auto;background:var(--card);z-index:70;border-radius:22px 22px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 22px);box-shadow:0 -20px 60px rgba(0,0,0,.35)}
.scrim{position:fixed;inset:0;background:rgba(5,9,20,.55);z-index:65;display:none}
.scrim.on{display:block}
.resinfo{font-size:14px;color:var(--muted);margin:0 0 14px}
.more{display:flex;justify-content:center;margin-top:26px}

/* product page */
.pdp{display:grid;gap:28px;padding:20px 0 60px}
@media (min-width:980px){.pdp{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:48px;padding-top:30px}}
.gal{background:var(--stage);border-radius:var(--r-lg);min-height:340px;display:grid;place-items:center;padding:30px;position:relative;overflow:hidden;isolation:isolate}
.gal::after{content:"";position:absolute;bottom:13%;left:50%;width:50%;height:22px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(15,23,42,.22),transparent);z-index:-1}
.gal img,.gal svg{max-height:340px;max-width:88%}
.gal .src{position:absolute;left:16px;bottom:12px;font-size:12px;color:var(--muted)}
@media (min-width:980px){.gal{position:sticky;top:90px;min-height:520px}}
.pdp h1{font-size:clamp(26px,3.2vw,38px);line-height:1.12;margin:6px 0 8px;font-weight:750;letter-spacing:-.01em}
.pdp .desc{color:var(--muted);font-size:16px;margin:0 0 20px;max-width:60ch}
.specs{display:grid;grid-template-columns:auto 1fr;gap:0;border-top:1px solid var(--line);margin:22px 0;font-size:14.5px}
.specs dt,.specs dd{padding:10px 0;border-bottom:1px solid var(--line);margin:0}
.specs dt{color:var(--muted);padding-right:20px}
.buy{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.buy .row{display:flex;align-items:end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.buy .sku{font-weight:750;font-size:22px;color:var(--blue)}
.buy .pr{font-size:22px;font-weight:750}
.buy .pr small{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.sizes{display:flex;flex-wrap:wrap;gap:6px;max-height:190px;overflow:auto;padding:2px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.qty button{width:40px;height:44px;border:0;background:transparent;cursor:pointer;font-size:18px}
.qty input{width:56px;height:44px;border:0;text-align:center;background:transparent;font-weight:650;-moz-appearance:textfield}
.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}
table.t{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
table.t th,table.t td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th{font-size:13px;color:var(--muted);font-weight:600;background:var(--stage);position:sticky;top:0}
table.t tr:last-child td{border-bottom:0}
table.t tr.on td{background:color-mix(in srgb,var(--blue) 9%,transparent)}
table.t td .btn{padding:7px 12px;font-size:13px}

/* AI panels */
.ai-card{background:linear-gradient(180deg,rgba(23,100,232,.08),transparent 70%),var(--card);border:1px solid color-mix(in srgb,var(--blue) 30%,var(--line));border-radius:var(--r-lg);padding:20px}
.ai-tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:650;color:var(--blue)}
.ai-tag svg{width:16px;height:16px}
.dark .ai-tag{color:#2F6FE0}
.ai-out{font-size:15px;line-height:1.6;white-space:pre-wrap;margin-top:12px}
.ai-out:empty{display:none}
.thinking{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--blue);animation:pulse 1.1s infinite ease-in-out}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}

.pg-th{width:58px;height:48px;flex:none;border:1.5px solid var(--line);border-radius:9px;background:#fff;padding:3px;cursor:pointer}
.pg-th img{width:100%;height:100%;object-fit:contain}
.pg-th[aria-pressed="true"]{border-color:var(--dark)}
.pg-tabs{margin-left:auto;flex:none}
/* HD photos: every photo is a white 1100 × 880 canvas with the product centred */
.pc .stage{background:#fff;padding:8px}
.pc .stage::after{display:none}
.pc .stage img,.pc .stage img.photo{width:100%;height:100%;max-width:none;max-height:none;object-fit:contain}
.range .art{background:#fff;padding:8px}
.range .art img{width:100%;height:100%;max-width:none;max-height:none;object-fit:contain;filter:none}
.vrow .th,.qi .th,.jr img{background:#fff}
.vrow .th img,.qi .th img{width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;object-fit:contain}
.vrow .th,.qi .th{padding:2px;border:1px solid var(--line)}
.gal .pg-photo img{padding:2%}
.gal.glug{background:#fff;border:1px solid var(--line)}
.tilt-in img{filter:none;max-height:none;width:min(560px,92%)}
.glug .sheen{display:none}
.hero-art img{filter:none}
.pg-th img{object-fit:contain}
img{image-rendering:auto}
@media (max-width:640px){.glug .g-hint{top:auto;bottom:44px;right:50%;transform:translateX(50%);white-space:nowrap}}
/* cut-out products: transparent background, soft contact shadow so white products read on white panels */
.pc .stage img,.range .art img,.vrow .th img,.qi .th img,.jr img,.gal .pg-photo img,.tilt-in img,.hero-art img{filter:drop-shadow(0 7px 9px rgba(15,23,42,.16))}
.vrow .th img,.qi .th img,.jr img{filter:drop-shadow(0 2px 3px rgba(15,23,42,.18))}
.pg-th img{filter:drop-shadow(0 1px 2px rgba(15,23,42,.18))}
.hero-art img{filter:drop-shadow(0 26px 30px rgba(15,23,42,.2))}
.pc .stage{background:#fff}
.gal.pgal{background:#fff}
/* fixed 5:4 frame for card photos so a cut-out can never spill out of its card */
.pc .stage{display:block;position:relative;height:auto;aspect-ratio:5/4;padding:0;overflow:hidden}
.pc .stage img,.pc .stage img.photo{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);max-width:none;max-height:none;object-fit:contain}
.range .art{position:relative;overflow:hidden}
.range .art img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px)}
</style>
</head>
